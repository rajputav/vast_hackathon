<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VSS Starter</title>
<style>
  body { margin: 0; padding: 20px 16px; background: #0f1115; color: #e8eaee; font: 14px/1.45 system-ui, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  input { padding: 8px 10px; width: min(100%, 420px); border-radius: 6px; border: 1px solid #2a2f3a; background: #181b22; color: inherit; }
  button { padding: 7px 12px; border-radius: 6px; border: 1px solid #2a2f3a; background: #1f232c; color: inherit; cursor: pointer; }
  button:disabled { opacity: .5; }
  .muted { color: #9aa2b1; font-size: 12px; }
  .ok { color: #3fb950; } .bad { color: #f85149; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; margin-top: 12px; }
  .card { background: #181b22; border: 1px solid #2a2f3a; border-radius: 8px; padding: 8px; }
  video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 4px; }
  p { margin: 6px 0; font-size: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>VSS Starter</h1>
  <div id="check" class="muted">Checking services…</div>
  <form id="f" style="margin-top:12px">
    <input id="q" placeholder="Search the archive">
    <button>Search</button>
  </form>
  <div id="status" class="muted"></div>
  <div id="grid" class="grid"></div>
</div>
<script>
// Ingress serves the app under /app and strips the prefix, so all calls are relative.
const BASE = location.pathname.endsWith('/') ? location.pathname : location.pathname + '/';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function post(path, body) {
  const r = await fetch(BASE + path, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || r.statusText);
  return d;
}

fetch(BASE + 'api/check').then(r => r.json()).then(d => {
  document.getElementById('check').innerHTML = Object.entries(d)
    .map(([k, v]) => `${k}: <span class="${v.ok ? 'ok' : 'bad'}">${v.ok ? 'ok' : esc(v.error || v.status)}</span>`).join(' · ');
}).catch(e => { document.getElementById('check').innerHTML = `<span class="bad">check failed: ${esc(e.message)}</span>`; });

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const status = document.getElementById('status'), grid = document.getElementById('grid');
  status.textContent = 'Searching…'; grid.innerHTML = '';
  try {
    const d = await post('api/search', { query: q });
    status.textContent = `${d.results.length} clips`;
    for (const r of d.results) {
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = `
        <video controls preload="metadata" src="${BASE}api/clip?source=${encodeURIComponent(r.source)}"></video>
        <div class="muted">${esc(r.filename)} · score ${(r.score ?? 0).toFixed(2)}</div>
        <p>${esc(r.caption.slice(0, 300))}</p>
        <button>Ask Cosmos</button>
        <p class="answer"></p>`;
      const btn = el.querySelector('button'), out = el.querySelector('.answer');
      btn.onclick = async () => {
        btn.disabled = true; out.textContent = 'Asking Cosmos…';
        try { out.textContent = (await post('api/ask', { source: r.source })).answer; }
        catch (err) { out.innerHTML = `<span class="bad">${esc(err.message)}</span>`; }
        finally { btn.disabled = false; }
      };
      grid.appendChild(el);
    }
  } catch (err) { status.innerHTML = `<span class="bad">Search failed: ${esc(err.message)}</span>`; }
});
</script>
</body>
</html>
